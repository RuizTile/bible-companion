<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bible Chapter Companion</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./navigation.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <a class="home-link" href="./index.html">Library</a>
        <div>
          <h1><a href="./index.html">Chapter Companion</a></h1>
          <p class="tagline">King James Version · Catholic-oriented</p>
        </div>
      </div>
      <nav class="picker">
        <label>Book
          <select id="bookSelect" aria-label="Book"></select>
        </label>
        <label>Chapter
          <select id="chapterSelect" aria-label="Chapter"></select>
        </label>
        <a class="feed-link desktop-only" href="./search.html">Search</a>
        <a class="feed-link desktop-only" href="./topics.html">Topics</a>
        <a id="swipeLink" class="feed-link desktop-only" href="./feed.html">Swipe</a>
        <button id="readToggle" class="read-toggle" type="button" aria-pressed="false">Mark read</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">Dark</button>
      </nav>
      <nav class="chapter-pager" aria-label="Chapter navigation">
        <button id="navPrev" class="nav-arrow prev" aria-label="Previous chapter" hidden>Previous</button>
        <button id="navNext" class="nav-arrow next" aria-label="Next chapter" hidden>Next</button>
      </nav>
    </header>

    <main id="layout" class="layout" hidden>
      <section class="scripture" aria-label="Scripture text">
        <div class="chapter-head">
          <h2 id="chapterTitle"></h2>
          <span id="canonBadge" class="badge"></span>
        </div>
        <div id="verses" class="verses"></div>
      </section>

      <aside class="companion" aria-label="Companion">
        <div class="companion-inner">
          <span id="statusPill" class="pill" hidden></span>

          <div class="block">
            <h3>In two minutes</h3>
            <p id="summary" class="summary"></p>
          </div>

          <div class="block">
            <h3>Takeaways</h3>
            <ol id="takeaways" class="takeaways"></ol>
          </div>

          <div class="block">
            <h3>Connections</h3>
            <div id="crossRefs" class="crossrefs"></div>
          </div>

          <div class="block" id="notesBlock">
            <h3>Interpretation</h3>
            <div id="notes" class="notes"></div>
          </div>
        </div>
      </aside>
    </main>

    <div id="message" class="message"></div>

    <footer class="footnote">
      <span>Catholic-oriented, not Catholic-approved. Every interpretation is attributed; traditions are labeled.</span>
    </footer>

    <nav class="app-nav" aria-label="Primary navigation">
      <a href="./index.html">Library</a>
      <a href="./read.html" aria-current="page">Read</a>
      <a href="./search.html">Search</a>
      <a href="./topics.html">Topics</a>
      <a id="mobileSwipeLink" href="./feed.html">Swipe</a>
    </nav>

    <script src="./theme.js"></script>
    <script src="./data-client.js"></script>
    <script src="./progress.js"></script>
    <script src="./read.js"></script>
  </body>
</html>
