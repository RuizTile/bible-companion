<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bible Chapter Companion</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <a class="home-link" href="./index.html" title="Index">✦</a>
        <div>
          <h1><a href="./index.html">Chapter Companion</a></h1>
          <p class="tagline">King James Version · Catholic-oriented</p>
        </div>
      </div>
      <nav class="picker">
        <label>Book
          <select id="bookSelect" aria-label="Book"></select>
        </label>
        <label>Chapter
          <select id="chapterSelect" aria-label="Chapter"></select>
        </label>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">☾</button>
      </nav>
    </header>

    <main id="layout" class="layout" hidden>
      <section class="scripture" aria-label="Scripture text">
        <div class="chapter-head">
          <h2 id="chapterTitle"></h2>
          <span id="canonBadge" class="badge"></span>
        </div>
        <div id="verses" class="verses"></div>
      </section>

      <aside class="companion" aria-label="Companion">
        <div class="companion-inner">
          <span id="statusPill" class="pill" hidden></span>

          <div class="block">
            <h3>In two minutes</h3>
            <p id="summary" class="summary"></p>
          </div>

          <div class="block">
            <h3>Takeaways</h3>
            <ol id="takeaways" class="takeaways"></ol>
          </div>

          <div class="block">
            <h3>Connections</h3>
            <div id="crossRefs" class="crossrefs"></div>
          </div>

          <div class="block" id="notesBlock">
            <h3>Interpretation</h3>
            <div id="notes" class="notes"></div>
          </div>
        </div>
      </aside>
    </main>

    <button id="navPrev" class="nav-arrow prev" aria-label="Previous chapter (←)" title="Previous chapter (←)" hidden>‹</button>
    <button id="navNext" class="nav-arrow next" aria-label="Next chapter (→)" title="Next chapter (→)" hidden>›</button>

    <div id="message" class="message"></div>

    <footer class="footnote">
      <span>Catholic-oriented, not Catholic-approved. Every interpretation is attributed; traditions are labeled.</span>
    </footer>

    <script src="./theme.js"></script>
    <script src="./read.js"></script>
  </body>
</html>
