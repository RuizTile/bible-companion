<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bible Chapter Companion — Swipe</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./feed.css" />
    <link rel="stylesheet" href="./navigation.css" />
  </head>
  <body class="feed-page">
    <header class="feed-topbar">
      <a class="home-link desktop-only" href="./index.html">Library</a>
      <span class="feed-mode">Swipe</span>
      <div class="feed-actions">
        <button id="navUp" type="button">Previous</button>
        <button id="navDown" type="button">Next</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">Dark</button>
      </div>
    </header>

    <div id="feed" class="feed"></div>

    <p id="message" class="message" hidden></p>

    <nav class="app-nav" aria-label="Primary navigation">
      <a href="./index.html">Library</a>
      <a id="deskLink" href="./read.html">Read</a>
      <a href="./search.html">Search</a>
      <a href="./topics.html">Topics</a>
      <a href="./feed.html" aria-current="page">Swipe</a>
    </nav>

    <script src="./theme.js"></script>
    <script src="./data-client.js"></script>
    <script src="./feed.js"></script>
  </body>
</html>
