<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Topics — Bible Chapter Companion</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./home.css" />
    <link rel="stylesheet" href="./navigation.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="top-controls">
        <a class="desktop-only" href="./read.html">Read</a>
        <a class="desktop-only" href="./search.html">Search</a>
        <a class="desktop-only" href="./feed.html">Swipe</a>
        <button id="themeToggle" type="button" data-theme-toggle aria-label="Toggle dark mode">Dark</button>
      </div>
      <div class="masthead-inner">
        <p class="mast-eyebrow">Cross-cutting themes</p>
        <h1 class="mast-title">Topics</h1>
        <p class="mast-sub">Every authored chapter tagged by theme — pick one to see every chapter that touches it.</p>
      </div>
      <div class="masthead-rule" aria-hidden="true"></div>
    </header>

    <main class="home">
      <div id="topicList" class="topic-list"></div>
      <h2 id="topicTitle" class="topic-title"></h2>
      <div id="topicChapters" class="topic-chapters"></div>
      <p id="message" class="message"></p>
    </main>

    <footer class="footnote">
      Catholic&#8209;oriented, not Catholic&#8209;approved.
    </footer>

    <nav class="app-nav" aria-label="Primary navigation">
      <a href="./index.html">Library</a>
      <a href="./read.html">Read</a>
      <a href="./search.html">Search</a>
      <a href="./topics.html" aria-current="page">Topics</a>
      <a href="./feed.html">Swipe</a>
    </nav>

    <script src="./theme.js"></script>
    <script src="./data-client.js"></script>
    <script src="./topics.js"></script>
  </body>
</html>
